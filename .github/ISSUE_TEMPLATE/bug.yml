name: Something isn't working
description: Explain what happened in your own words.
title: ""
body:
  - type: textarea
    id: intended
    attributes:
      label: What were you trying to do?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include the message you saw, if there was one. Do not include private project contents, tokens, or account details.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Your computer and Unforge version
      placeholder: macOS or Linux, Unforge 0.3.0
