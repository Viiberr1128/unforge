name: Make something easier
description: Tell us about a task that takes more effort than it should.
body:
  - type: textarea
    id: problem
    attributes:
      label: What is hard today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a useful result look like?
      description: An example is welcome. You do not need to propose a technical solution.
    validations:
      required: true
